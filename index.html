<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D T-Rex Runner Game</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        #ui-container {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #333;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(255,255,255,0.8);
            pointer-events: none;
        }
        #score-board {
            margin-bottom: 5px;
        }
        #high-score {
            font-size: 16px;
            color: #666;
        }
        #game-over-screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            background: rgba(255, 255, 255, 0.9);
            padding: 30px 5px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            display: none;
            width: 320px;
        }
        h1 {
            margin: 0 0 10px 0;
            color: #d9534f;
            font-size: 28px;
        }
        p {
            margin: 0 0 20px 0;
            color: #555;
            font-size: 16px;
        }
        button {
            background-color: #5cb85c;
            color: white;
            border: none;
            padding: 12px 28px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        button:hover {
            background-color: #4cae4c;
            transform: translateY(-2px);
        }
        button:active {
            transform: translateY(0);
        }
        #instructions {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255,255,255,0.7);
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 14px;
            color: #444;
            pointer-events: none;
            text-align: center;
        }
    </style>
    <!-- Include Three.js via CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>
    
    <div id="ui-container">
        <div id="score-board">SCORE: 00000</div>
        <div id="high-score">HI: 00000</div>
    </div>

    <div id="game-over-screen">
        <h1>GAME OVER</h1>
        <p id="final-score">Your Score: 0</p>
        <button id="restart-btn">PLAY AGAIN</button>
    </div>

    <div id="instructions">Press <b>SPACEBAR</b> or <b>TAP SCREEN</b> to Jump</div>

    <script>
        // --- GAME STATE ---
        let scene, camera, renderer;
        let dino, ground, obstacles = [], clouds = [];
        let isGrounded = true;
        let dinoVelocityY = 0;
        let score = 0;
        let highScore = 0;
        let gameActive = true;
        let gameSpeed = 0.4;
        const GRAVITY = -0.015;
        const JUMP_FORCE = 0.35;
        
        // Configuration
        const DINO_Y_GROUND = 1;
        const OBSTACLE_SPAWN_CHANCE = 0.015;
        let nextSpawnTimer = 0;

        // --- DOM ELEMENTS ---
        const scoreBoard = document.getElementById('score-board');
        const highScoreBoard = document.getElementById('high-score');
        const gameOverScreen = document.getElementById('game-over-screen');
        const finalScoreText = document.getElementById('final-score');
        const restartBtn = document.getElementById('restart-btn');

        // --- INIT THREE.JS ---
        function init() {
            const container = document.getElementById('canvas-container');
            
            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xe0e0e0);
            scene.fog = new THREE.FogExp2(0xe0e0e0, 0.015);

            // Camera
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(-15, 8, 0);
            camera.lookAt(5, 2, 0);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            // Lights
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(-20, 40, 20);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 1024;
            dirLight.shadow.mapSize.height = 1024;
            dirLight.shadow.camera.near = 0.5;
            dirLight.shadow.camera.far = 100;
            const d = 20;
            dirLight.shadow.camera.left = -d;
            dirLight.shadow.camera.right = d;
            dirLight.shadow.camera.top = d;
            dirLight.shadow.camera.bottom = -d;
            scene.add(dirLight);

            // Build Environment
            createGround();
            createDino();

            // Event Listeners
            window.addEventListener('keydown', handleKeyDown);
            window.addEventListener('touchstart', handleTouch);
            window.addEventListener('resize', onWindowResize);
            restartBtn.addEventListener('click', resetGame);

            // Start Loop
            animate();
        }

        // --- CREATION FUNCTIONS ---
        function createGround() {
            const groundGeo = new THREE.BoxGeometry(200, 2, 15);
            const groundMat = new THREE.MeshStandardMaterial({ color: 0xd0d0d0, roughness: 0.8 });
            ground = new THREE.Mesh(groundGeo, groundMat);
            ground.position.set(40, 0, 0);
            ground.receiveShadow = true;
            scene.add(ground);

            // Ground texture grid lines (fake stylistic look)
            for(let i = -20; i < 100; i += 10) {
                createGroundMarker(i);
            }
        }

        function createGroundMarker(xPos) {
            const markerGeo = new THREE.BoxGeometry(1, 0.05, 12);
            const markerMat = new THREE.MeshStandardMaterial({ color: 0xc8c8c8 });
            const marker = new THREE.Mesh(markerGeo, markerMat);
            marker.position.set(xPos, 1.01, 0);
            scene.add(marker);
            // Attach to ground movement logic implicitly via tracking x
            obstacles.push({ mesh: marker, type: 'marker', boundingBox: new THREE.Box3() });
        }

        function createDino() {
            // Stylized Low-Poly T-Rex Group
            dino = new THREE.Group();

            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x555555, roughness: 0.6 });
            const eyeMat = new THREE.MeshBasicMaterial({ color: 0xffffff });

            // Main Body
            const body = new THREE.Mesh(new THREE.BoxGeometry(2, 1.5, 1.2), bodyMat);
            body.position.set(0, 1, 0);
            body.castShadow = true;
            dino.add(body);

            // Head
            const head = new THREE.Mesh(new THREE.BoxGeometry(1.4, 1.2, 1.1), bodyMat);
            head.position.set(1.2, 1.8, 0);
            head.castShadow = true;
            dino.add(head);

            // Snout
            const snout = new THREE.Mesh(new THREE.BoxGeometry(1, 0.7, 1.1), bodyMat);
            snout.position.set(2, 1.6, 0);
            snout.castShadow = true;
            dino.add(snout);

            // Eyes
            const eyeL = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.2, 0.2), eyeMat);
            eyeL.position.set(1.5, 2, 0.56);
            const eyeR = eyeL.clone();
            eyeR.position.z = -0.56;
            dino.add(eyeL, eyeR);

            // Tail
            const tail = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.8, 0.8), bodyMat);
            tail.position.set(-1.4, 0.8, 0);
            tail.rotation.z = 0.3;
            tail.castShadow = true;
            dino.add(tail);

            // Legs
            const legGeo = new THREE.BoxGeometry(0.4, 1, 0.4);
            dino.leftLeg = new THREE.Mesh(legGeo, bodyMat);
            dino.leftLeg.position.set(0.4, 0.2, 0.3);
            dino.leftLeg.castShadow = true;
            
            dino.rightLeg = dino.leftLeg.clone();
            dino.rightLeg.position.z = -0.3;
            
            dino.add(dino.leftLeg, dino.rightLeg);

            dino.position.set(0, DINO_Y_GROUND, 0);
            scene.add(dino);
            
            // Add a collider bounding box reference
            dino.boundingBox = new THREE.Box3();
        }

        function spawnObstacle() {
            if (nextSpawnTimer > 0) {
                nextSpawnTimer--;
                return;
            }

            // Randomize type: 0 = Single Cactus, 1 = Double Cactus, 2 = Bird
            const type = Math.floor(Math.random() * 3);
            let obstacleMesh;
            const obsMat = new THREE.MeshStandardMaterial({ color: 0x444444, roughness: 0.7 });

            if (type === 0 || type === 1) {
                // Cactus
                obstacleMesh = new THREE.Group();
                const mainStem = new THREE.Mesh(new THREE.BoxGeometry(0.6, 2, 0.6), obsMat);
                mainStem.position.y = 1;
                mainStem.castShadow = true;
                obstacleMesh.add(mainStem);

                if (type === 1) {
                    // Double cactus: Add side branch
                    const sideStem = new THREE.Mesh(new THREE.BoxGeometry(0.5, 1.4, 0.5), obsMat);
                    sideStem.position.set(0.6, 0.7, 0);
                    sideStem.castShadow = true;
                    obstacleMesh.add(sideStem);
                }
                obstacleMesh.position.set(60, 1, 0); // Start far right
            } else {
                // Bird (Pterodactyl)
                obstacleMesh = new THREE.Group();
                const birdBody = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.5, 0.6), obsMat);
                birdBody.castShadow = true;
                obstacleMesh.add(birdBody);
                
                // Wings
                const wing = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.1, 1.5), obsMat);
                wing.position.y = 0.2;
                wing.castShadow = true;
                obstacleMesh.add(wing);

                // Random height for bird
                const heightY = Math.random() > 0.5 ? 3.5 : 2.2;
                obstacleMesh.position.set(60, heightY, 0);
            }

            scene.add(obstacleMesh);
            obstacles.push({
                mesh: obstacleMesh,
                type: type === 2 ? 'bird' : 'cactus',
                boundingBox: new THREE.Box3()
            });

            // Set minimum spacing between obstacles
            nextSpawnTimer = Math.floor(Math.random() * 50) + 60;
        }

        function spawnCloud() {
            if (Math.random() > 0.008) return;
            const cloudMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.9, transparent: true, opacity: 0.8 });
            const cloud = new THREE.Group();
            
            const numBlocks = Math.floor(Math.random() * 3) + 2;
            for(let i=0; i<numBlocks; i++) {
                const b = new THREE.Mesh(new THREE.BoxGeometry(2 + Math.random()*2, 1, 1.5), cloudMat);
                b.position.set(i*1.5, Math.random()*0.4, 0);
                cloud.add(b);
            }
            
            cloud.position.set(60, 8 + Math.random() * 4, -4 - Math.random() * 6);
            scene.add(cloud);
            clouds.push(cloud);
        }

        // --- INTERACTION & LOGIC ---
        function handleKeyDown(e) {
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                jump();
            }
        }

        function handleTouch() {
            jump();
        }

        function jump() {
            if (isGrounded && gameActive) {
                dinoVelocityY = JUMP_FORCE;
                isGrounded = false;
            }
        }

        function checkCollision(obj1, obj2) {
            return obj1.intersectsBox(obj2);
        }

        function endGame() {
            gameActive = false;
            gameOverScreen.style.display = 'block';
            finalScoreText.innerText = `Your Score: ${Math.floor(score)}`;
            if (score > highScore) {
                highScore = score;
                highScoreBoard.innerText = `HI: ${String(Math.floor(highScore)).padStart(5, '0')}`;
            }
        }

        function resetGame() {
            // Clean out old obstacles
            obstacles.forEach(obs => scene.remove(obs.mesh));
            clouds.forEach(c => scene.remove(c));
            obstacles = [];
            clouds = [];

            // Add original floor markers back
            for(let i = -20; i < 100; i += 10) {
                createGroundMarker(i);
            }

            // Reset variables
            score = 0;
            gameSpeed = 0.4;
            dino.position.y = DINO_Y_GROUND;
            dinoVelocityY = 0;
            isGrounded = true;
            nextSpawnTimer = 0;
            gameActive = true;

            gameOverScreen.style.display = 'none';
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- MAIN GAME LOOP ---
        function animate() {
            requestAnimationFrame(animate);

            if (gameActive) {
                // 1. Handle Dino Physics & Jump
                if (!isGrounded) {
                    dinoVelocityY += GRAVITY;
                    dino.position.y += dinoVelocityY;

                    if (dino.position.y <= DINO_Y_GROUND) {
                        dino.position.y = DINO_Y_GROUND;
                        dinoVelocityY = 0;
                        isGrounded = true;
                    }
                    // Freeze legs in mid-air
                    dino.leftLeg.rotation.z = 0;
                    dino.rightLeg.rotation.z = 0;
                } else {
                    // Running Leg Animation
                    const time = Date.now() * 0.015;
                    dino.leftLeg.rotation.z = Math.sin(time) * 0.6;
                    dino.rightLeg.rotation.z = -Math.sin(time) * 0.6;
                }

                // Update Dino Bounding Box (accounting for full posture hierarchy)
                dino.boundingBox.setFromObject(dino);

                // 2. Spawn and Handle Obstacles & Decor
                spawnObstacle();
                spawnCloud();

                // Gradually increase speed
                gameSpeed += 0.0001;

                // Loop backwards to safely remove elements from array
                for (let i = obstacles.length - 1; i >= 0; i--) {
                    const obs = obstacles[i];
                    obs.mesh.position.x -= gameSpeed;

                    // If it passes off screen left, destroy it
                    if (obs.mesh.position.x < -25) {
                        scene.remove(obs.mesh);
                        obstacles.splice(i, 1);
                        continue;
                    }

                    // Only check colliders for gameplay obstructions (skip visual markers)
                    if (obs.type !== 'marker') {
                        obs.boundingBox.setFromObject(obs.mesh);
                        
                        // Check Collision
                        if (checkCollision(dino.boundingBox, obs.boundingBox)) {
                            endGame();
                        }
                    } else {
                        // Endless recycling logic for ground lines
                        if (obs.mesh.position.x < -20) {
                            obs.mesh.position.x += 110;
                        }
                    }
                }

                // Handle Clouds
                for (let i = clouds.length - 1; i >= 0; i--) {
                    clouds[i].position.x -= gameSpeed * 0.3; // Move slower for parallax effect
                    if (clouds[i].position.x < -30) {
                        scene.remove(clouds[i]);
                        clouds.splice(i, 1);
                    }
                }

                // 3. Score Track
                score += 0.15;
                scoreBoard.innerText = `SCORE: ${String(Math.floor(score)).padStart(5, '0')}`;
            }

            renderer.render(scene, camera);
        }

        // Run setup
        init();

    </script>
</body>
</html>
