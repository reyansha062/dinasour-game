<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Neon Dino Runner</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #1a0033;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
            padding: 20px;
        }
        .hud-element {
            pointer-events: auto;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(255, 0, 128, 0.7);
        }
        #score-board {
            display: flex;
            justify-content: space-between;
            color: #00ffff;
            font-size: 24px;
        }
        #game-over-screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #ff007f;
            display: none;
            pointer-events: auto;
            background: rgba(26, 0, 51, 0.85);
            padding: 40px;
            border-radius: 15px;
            border: 3px solid #ff007f;
            box-shadow: 0 0 30px rgba(255, 0, 127, 0.5);
        }
        #game-over-screen h1 {
            font-size: 48px;
            margin: 0 0 10px 0;
            color: #ff007f;
            text-shadow: 0 0 20px #ff007f;
        }
        #game-over-screen p {
            font-size: 18px;
            color: #00ffff;
            margin: 0 0 25px 0;
        }
        .btn {
            background: #ff007f;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px #ff007f;
            text-transform: uppercase;
        }
        .btn:hover {
            background: #00ffff;
            color: #1a0033;
            box-shadow: 0 0 20px #00ffff;
        }
        #instructions {
            align-self: center;
            color: #9d4edd;
            font-size: 14px;
            margin-bottom: 10px;
            text-align: center;
            background: rgba(0,0,0,0.4);
            padding: 8px 20px;
            border-radius: 20px;
        }
    </style>
    <!-- Three.js Library -->
    <script src="https://cloudflare.com"></script>
</head>
<body>

    <div id="canvas-container"></div>
    
    <div id="ui-layer">
        <div id="score-board" class="hud-element">
            <div id="score-display">SCORE: 00000</div>
            <div id="high-score-display">HI: 00000</div>
        </div>
        
        <div id="instructions">PRESS SPACEBAR, UP ARROW, OR TAP SCREEN TO JUMP</div>
    </div>

    <div id="game-over-screen">
        <h1>GAME OVER</h1>
        <p id="final-score">FINAL SCORE: 0</p>
        <button class="btn" id="restart-btn">PLAY AGAIN</button>
    </div>

    <script>
        // --- GAME STATE VARIABLES ---
        let scene, camera, renderer;
        let dino, ground, gridHelper;
        let obstacles = [];
        let particles = [];
        
        let isPlaying = true;
        let score = 0;
        let highScore = localStorage.getItem('dino_hi_score') || 0;
        let gameSpeed = 0.35;
        const maxSpeed = 0.8;
        const speedIncrement = 0.0001;
        
        // Dino Physics Physics
        let isJumping = false;
        let jumpVelocity = 0;
        const gravity = 0.015;
        const jumpStrength = 0.35;
        const floorY = 0;

        // Timers for Spawning
        let obstacleTimer = 0;
        let nextObstacleTime = 60; 

        // UI Selectors
        const scoreDisplay = document.getElementById('score-display');
        const highScoreDisplay = document.getElementById('high-score-display');
        const gameOverScreen = document.getElementById('game-over-screen');
        const finalScore = document.getElementById('final-score');
        const restartBtn = document.getElementById('restart-btn');

        // --- INITIALIZATION ---
        function init() {
            highScoreDisplay.innerText = `HI: ${String(highScore).padStart(5, '0')}`;

            // Create Neon Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a0033);
            scene.fog = new THREE.FogExp2(0x1a0033, 0.015);

            // Camera Setup
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(-12, 6, 0); 
            camera.lookAt(5, 3, 0);

            // Renderer Setup
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // Ambient and Dramatic Stage Lighting
            const ambientLight = new THREE.AmbientLight(0x221144);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xff00aa, 1.2);
            dirLight.position.set(-10, 20, 10);
            dirLight.castShadow = true;
            scene.add(dirLight);

            const pointLight = new THREE.PointLight(0x00ffff, 1.5, 30);
            pointLight.position.set(0, 5, 0);
            scene.add(pointLight);

            // Build Game Components
            createGround();
            createDino();

            // Window Resizing Setup
            window.addEventListener('resize', onWindowResize, false);

            // Controls setup
            window.addEventListener('keydown', handleKeyDown);
            window.addEventListener('touchstart', handleTouch);
            restartBtn.addEventListener('click', resetGame);

            // Start loop
            animate();
        }

        // --- CREATE MAP FLOOR ---
        function createGround() {
            const groundGeo = new THREE.PlaneGeometry(1000, 40);
            const groundMat = new THREE.MeshStandardMaterial({ 
                color: 0x0d001a, 
                roughness: 0.8 
            });
            ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.position.y = -0.05;
            ground.receiveShadow = true;
            scene.add(ground);

            // Retro Neon Grid Lines
            gridHelper = new THREE.GridHelper(1000, 150, 0xff007f, 0x440066);
            gridHelper.position.y = 0;
            scene.add(gridHelper);
        }

        // --- CREATE CYAN DINO WITH PINK SPIKES ---
        function createDino() {
            dino = new THREE.Group();

            // Vibrant Cyan Body Skin Mat
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x00ffff, roughness: 0.2, metalness: 0.1 });
            // Neon Pink Accent Spine Plates
            const spineMat = new THREE.MeshStandardMaterial({ color: 0xff007f, emissive: 0xff007f, emissiveIntensity: 0.5 });

            // Torso Segment
            const torso = new THREE.Mesh(new THREE.BoxGeometry(2.2, 1.2, 1), bodyMat);
            torso.position.y = 1.6;
            torso.castShadow = true;
            dino.add(torso);

            // Neck Segment
            const neck = new THREE.Mesh(new THREE.BoxGeometry(0.6, 1.0, 0.7), bodyMat);
            neck.position.set(0.9, 2.3, 0);
            neck.castShadow = true;
            dino.add(neck);

            // Head Segment
            const head = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.8, 0.8), bodyMat);
            head.position.set(1.4, 2.8, 0);
            head.castShadow = true;
            dino.add(head);

            // Eyes
            const eyeMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
            const eye = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.2, 0.9), eyeMat);
            eye.position.set(1.6, 2.9, 0);
            dino.add(eye);

            // Tail Segment
            const tail = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.6, 0.6), bodyMat);
            tail.position.set(-1.4, 1.5, 0);
            tail.rotation.z = -0.2;
            tail.castShadow = true;
            dino.add(tail);

            // Spikes on the spine
            for(let i = 0; i < 4; i++) {
                const spike = new THREE.Mesh(new THREE.ConeGeometry(0.15, 0.4, 4), spineMat);
                spike.position.set(-1.2 + (i * 0.6), 2.1 - (i*0.15), 0);
                spike.rotation.z = -0.4;
                dino.add(spike);
            }

            // Left & Right Animated Legs
            const legGeo = new THREE.BoxGeometry(0.4, 0.9, 0.3);
            dino.leftLeg = new THREE.Mesh(legGeo, bodyMat);
            dino.leftLeg.position.set(0.4, 0.5, 0.3);
            dino.leftLeg.castShadow = true;
            dino.add(dino.leftLeg);

            dino.rightLeg = new THREE.Mesh(legGeo, bodyMat);
            dino.rightLeg.position.set(-0.4, 0.5, -0.3);
            dino.rightLeg.castShadow = true;
            dino.add(dino.rightLeg);

            dino.position.set(0, floorY, 0);
            scene.add(dino);
        }
