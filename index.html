<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Neon Dino Runner - Fixed</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #1a0033;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
            padding: 20px;
            z-index: 5;
        }
        .hud-element {
            pointer-events: auto;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(255, 0, 128, 0.7);
        }
        #score-board {
            display: flex;
            justify-content: space-between;
            color: #00ffff;
            font-size: 24px;
        }
        #pause-screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #00ffff;
            display: none;
            pointer-events: auto;
            background: rgba(13, 0, 26, 0.9);
            padding: 35px 50px;
            border-radius: 15px;
            border: 3px solid #00ffff;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.4);
            z-index: 10;
        }
        #pause-screen h2 {
            font-size: 38px;
            margin: 0 0 10px 0;
            color: #00ffff;
            text-shadow: 0 0 20px #00ffff;
            letter-spacing: 4px;
        }
        #pause-screen p {
            font-size: 14px;
            color: #9d4edd;
            margin: 0 0 25px 0;
        }
        #game-over-screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #ff007f;
            display: none;
            pointer-events: auto;
            background: rgba(26, 0, 51, 0.9);
            padding: 40px;
            border-radius: 15px;
            border: 3px solid #ff007f;
            box-shadow: 0 0 30px rgba(255, 0, 127, 0.5);
            z-index: 10;
        }
        #game-over-screen h1 {
            font-size: 48px;
            margin: 0 0 10px 0;
            color: #ff007f;
            text-shadow: 0 0 20px #ff007f;
        }
        #game-over-screen p {
            font-size: 18px;
            color: #00ffff;
            margin: 0 0 25px 0;
        }
        .btn {
            background: #ff007f;
            color: white;
            border: none;
            padding: 12px 35px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px #ff007f;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn:hover {
            background: #00ffff;
            color: #1a0033;
            box-shadow: 0 0 20px #00ffff;
        }
        .btn-pause {
            background: #00ffff;
            color: #1a0033;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.4);
        }
        .btn-pause:hover {
            background: #ff007f;
            color: white;
            box-shadow: 0 0 20px #ff007f;
        }
        #pause-trigger-hud {
            position: absolute;
            top: 70px;
            right: 20px;
            pointer-events: auto;
            color: #9d4edd;
            font-size: 12px;
            cursor: pointer;
            background: rgba(0,0,0,0.4);
            padding: 5px 12px;
            border-radius: 10px;
            border: 1px solid #440066;
        }
        #instructions {
            align-self: center;
            color: #9d4edd;
            font-size: 14px;
            margin-bottom: 10px;
            text-align: center;
            background: rgba(0,0,0,0.4);
            padding: 8px 20px;
            border-radius: 20px;
        }
    </style>
    <script src="https://cloudflare.com"></script>
</head>
<body>

    <div id="canvas-container"></div>
    
    <div id="ui-layer">
        <div id="score-board" class="hud-element">
            <div id="score-display">SCORE: 00000</div>
            <div id="high-score-display">HI: 00000</div>
        </div>
        
        <div id="pause-trigger-hud">PRESS 'P' TO PAUSE</div>
        
        <div id="instructions">SPACEBAR / UP ARROW TO JUMP • P TO PAUSE</div>
    </div>

    <div id="pause-screen">
        <h2>GAME PAUSED</h2>
        <p>Simulation Engine Frozen Successfully</p>
        <button class="btn btn-pause" id="resume-btn">Resume Game</button>
    </div>

    <div id="game-over-screen">
        <h1>GAME OVER</h1>
        <p id="final-score">FINAL SCORE: 0</p>
        <button class="btn" id="restart-btn">PLAY AGAIN</button>
    </div>

    <script>
        let scene, camera, renderer;
        let dino, ground, gridHelper;
        let obstacles = [];
        let particles = [];
        
        let isPlaying = true;
        let isPaused = false;
        let score = 0;
        let highScore = localStorage.getItem('dino_hi_score') || 0;
        let gameSpeed = 0.35;
        const maxSpeed = 0.8;
        const speedIncrement = 0.0001;
        
        let isJumping = false;
        let jumpVelocity = 0;
        const gravity = 0.015;
        const jumpStrength = 0.35;
        const floorY = 0;

        let obstacleTimer = 0;
        let nextObstacleTime = 60; 

        const scoreDisplay = document.getElementById('score-display');
        const highScoreDisplay = document.getElementById('high-score-display');
        const gameOverScreen = document.getElementById('game-over-screen');
        const pauseScreen = document.getElementById('pause-screen');
        const finalScore = document.getElementById('final-score');
        const restartBtn = document.getElementById('restart-btn');
        const resumeBtn = document.getElementById('resume-btn');
        const pauseHudBtn = document.getElementById('pause-trigger-hud');

        function init() {
            highScoreDisplay.innerText = `HI: ${String(highScore).padStart(5, '0')}`;

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a0033);
            scene.fog = new THREE.FogExp2(0x1a0033, 0.015);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(-12, 6, 0); 
            camera.lookAt(5, 3, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0x221144);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xff00aa, 1.2);
            dirLight.position.set(-10, 20, 10);
            dirLight.castShadow = true;
            scene.add(dirLight);

            const pointLight = new THREE.PointLight(0x00ffff, 1.5, 30);
            pointLight.position.set(0, 5, 0);
            scene.add(pointLight);

            createGround();
            createDino();

            window.addEventListener('resize', onWindowResize, false);
            window.addEventListener('keydown', handleKeyDown);
            window.addEventListener('touchstart', handleTouch);
            
            restartBtn.addEventListener('click', resetGame);
            resumeBtn.addEventListener('click', togglePause);
            pauseHudBtn.addEventListener('click', togglePause);

            setInterval(() => {
                if (renderer && camera) {
                    onWindowResize();
                }
            }, 200);

            animate();
        }

        function createGround() {
            const groundGeo = new THREE.PlaneGeometry(1000, 40);
            const groundMat = new THREE.MeshStandardMaterial({ color: 0x0d001a, roughness: 0.8 });
            ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.position.y = -0.05;
            ground.receiveShadow = true;
            scene.add(ground);

            gridHelper = new THREE.GridHelper(1000, 150, 0xff007f, 0x440066);
            gridHelper.position.y = 0;
            scene.add(gridHelper);
        }

        function createDino() {
            dino = new THREE.Group();

            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x00ffff, roughness: 0.2, metalness: 0.1 });
            const spineMat = new THREE.MeshStandardMaterial({ color: 0xff007f, emissive: 0xff007f, emissiveIntensity: 0.5 });

            const torso = new THREE.Mesh(new THREE.BoxGeometry(2.2, 1.2, 1), bodyMat);
            torso.position.y = 1.6;
            torso.castShadow = true;
            dino.add(torso);

            const neck = new THREE.Mesh(new THREE.BoxGeometry(0.6, 1.0, 0.7), bodyMat);
            neck.position.set(0.9, 2.3, 0);
            neck.castShadow = true;
            dino.add(neck);

            const head = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.8, 0.8), bodyMat);
            head.position.set(1.4, 2.8, 0);
